# Builds the ready-to-upload skill zip and attaches it to a release
# whenever a version tag (v1.2.3) is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the skill
        run: cd skills && zip -r ../academic-paper-slides.zip academic-paper-slides
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" academic-paper-slides.zip --clobber
